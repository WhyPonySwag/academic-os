name: ACADEMIC OS visual previews

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "visual/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build application for clean, isolated data
        run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - name: Capture empty and populated sections at five viewport widths
        env:
          ACADEMIC_E2E_SKIP_BUILD: "1"
        run: npm exec -- playwright test --config visual/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-os-visual-preview
          path: visual-output/*.png
          if-no-files-found: warn
          retention-days: 7
